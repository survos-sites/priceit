services:
    Aws\S3\S3Client:
        arguments:
            - version: '2006-03-01'
              # Hetzner ignores the region for routing — the endpoint encodes it —
              # but the SDK insists on one being set.
              region: 'fsn1'
              endpoint: '%env(S3_ENDPOINT)%'
              use_path_style_endpoint: true
              credentials:
                  key: '%env(AWS_S3_ACCESS_ID)%'
                  secret: '%env(AWS_S3_ACCESS_SECRET)%'

flysystem:
    storages:
        media.storage:
            aws:
                client: 'Aws\S3\S3Client'
                bucket: '%env(AWS_S3_BUCKET_NAME)%'
                streamReads: true

# Locally there is no reason to push every test photo to Hetzner, and a dev
# machine without credentials should still be able to capture. The same service
# id resolves to a directory under public/ instead.
when@dev:
    flysystem:
        storages:
            media.storage:
                local:
                    directory: '%kernel.project_dir%/public/uploads/media'

when@test:
    flysystem:
        storages:
            media.storage:
                memory: ~
