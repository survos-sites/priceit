survos_marketplace:
    ebay:
        client_id: '%env(EBAY_CLIENT_ID)%'
        client_secret: '%env(EBAY_CLIENT_SECRET)%'
        # eBay's redirect-URI ALIAS from the developer portal, not a URL.
        ru_name: '%env(EBAY_RU_NAME)%'

    mercadolibre:
        client_id: '%env(MELI_CLIENT_ID)%'
        client_secret: '%env(MELI_CLIENT_SECRET)%'
        # Must match a redirect URI registered on the app, character for character.
        redirect_uri: '%env(MELI_REDIRECT_URI)%'
        site: MLM

    connections:
        # Dave's store. The business policy ids and location key come from his
        # seller account after he authorizes the app -- they are not secrets, but
        # they are per-seller, so they live in env rather than here.
        dave:
            driver: ebay
            site: EBAY_US
            # eBay's sandbox is a separate world: separate keyset, separate test
            # users, separate data. Flip to false only when going live for real.
            sandbox: true
            options:
                merchant_location_key: '%env(default::EBAY_LOCATION_KEY)%'
                fulfillment_policy_id: '%env(default::EBAY_FULFILLMENT_POLICY)%'
                payment_policy_id: '%env(default::EBAY_PAYMENT_POLICY)%'
                return_policy_id: '%env(default::EBAY_RETURN_POLICY)%'

        # chijal (Chiapas). Mercado Libre has no US marketplace -- its sites are
        # Latin American -- so this is for selling in Mexico, not for Dave.
        #
        # No credentials here on purpose: category discovery and attribute lookup
        # are PUBLIC on Mercado Libre, so this connection is usable today, before
        # any seller has authorized anything. Publishing through it will fail
        # loudly until a token provider is wired.
        chijal:
            driver: mercadolibre
            site: MLM

        # Marcela — a second Mercado Libre seller on the SAME application. The
        # client id identifies the software, not the seller; each connection just
        # holds its own token, in its own file under token_dir.
        marcela:
            driver: mercadolibre
            site: MLM

        # Etsy keys are PER SELLER, not shared: the instantly-approved Seller App
        # tier only reaches the shop that registered it, so each seller registers
        # their own app at etsy.com/developers/register-seller-app and supplies a
        # keystring. That is why these live in options rather than a shared block.
        #
        # tac_test is your own throwaway shop. Etsy removed its sandbox, so a real
        # shop with "test" in the name and Developer Mode on is the sanctioned way
        # to test — see their API testing policy. Drafts cost nothing.
        tac_test:
            driver: etsy
            site: ETSY
            options:
                keystring: '%env(ETSY_TEST_KEYSTRING)%'
                shared_secret: '%env(ETSY_TEST_SHARED_SECRET)%'
                redirect_uri: '%env(ETSY_REDIRECT_URI)%'
                shop_id: '%env(ETSY_TEST_SHOP_ID)%'
                # Vintage postcards: not made by the seller, and pre-2007.
                who_made: someone_else
                when_made: before_2007
