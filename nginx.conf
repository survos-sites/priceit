add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";

# nginx rejects a large body before PHP ever sees it, so this has to match the
# fpm limits or the upload dies with a 413 that never reaches the app.
client_max_body_size 100M;

index index.php;
charset utf-8;

location ^~ /assets/ {
    expires max;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# The service worker and the scripts it importScripts() decide when every other
# cache is allowed to update, so they must never be cached themselves. Served
# without Cache-Control, a browser applies heuristic freshness -- roughly a tenth
# of the file's age -- and the window grows every day the file goes unchanged. A
# phone can then keep running the previous worker, and its precached assets, long
# after a deploy. updateViaCache defaults to "imports", so the imports in
# particular are read straight from the HTTP cache.
location ~ ^/(sw\.js|workbox/|idb/) {
    add_header Cache-Control "no-cache";
    try_files $uri /index.php$is_args$args;
}

location / {
    try_files $uri /index.php$is_args$args;
}

location ~ ^/(var|config|src|templates|migrations)/ {
    deny all;
}
