add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";

# nginx rejects a large body before PHP ever sees it, so this has to match the
# fpm limits or the upload dies with a 413 that never reaches the app.
client_max_body_size 100M;

index index.php;
charset utf-8;

location ^~ /assets/ {
    expires max;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location / {
    try_files $uri /index.php$is_args$args;
}

location ~ ^/(var|config|src|templates|migrations)/ {
    deny all;
}
