add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";

# nginx rejects a large body before PHP ever sees it, so this has to match the
# fpm limits or the upload dies with a 413 that never reaches the app.
client_max_body_size 100M;

index index.php;
charset utf-8;

location ^~ /assets/ {
    expires max;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# The service worker and the scripts it importScripts() decide when every other
# cache is allowed to update, so they must never be cached themselves. Served
# without Cache-Control, a browser applies heuristic freshness -- roughly a tenth
# of the file's age -- and the window grows every day the file goes unchanged. A
# phone can then keep running the previous worker, and its precached assets, long
# after a deploy. updateViaCache defaults to "imports", so the imports in
# particular are read straight from the HTTP cache.
location ~ ^/(sw\.js|workbox/|idb/) {
    # nginx does not merge add_header down: a block with any add_header of its own
    # inherits none from its parent, so the two global ones have to be repeated here
    # or this location would quietly serve JavaScript without nosniff.
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Cache-Control "no-cache";
    try_files $uri /index.php$is_args$args;
}

# /favicon.ico: browsers request it unprompted on the first page view of every
# session. Without a terminating location it falls through to index.php and
# Symfony answers with a NotFoundHttpException -- never a real error, and the
# noisiest line in the production log. try_files ends the request in nginx:
# public/favicon.ico when it exists, 204 otherwise, PHP never involved.
location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }

location / {
    try_files $uri /index.php$is_args$args;
}

location ~ ^/(var|config|src|templates|migrations)/ {
    deny all;
}
